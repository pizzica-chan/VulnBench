services:
  mysql:
    image: mysql:8.0
    container_name: secapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: secapp
      MYSQL_USER: secapp
      MYSQL_PASSWORD: secapp
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # 永続ボリュームにしない。コンテナ再作成／再起動のたびに空の DB から起動（教材用に毎回同じ初期データ）。
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 25s

  app:
    build: .
    image: secapp-web
    container_name: secapp-web
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
