services:
  mysql:
    image: mysql:8.0
    container_name: secapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: secapp
      MYSQL_USER: secapp
      MYSQL_PASSWORD: secapp
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - secapp-mysql-data:/var/lib/mysql

volumes:
  secapp-mysql-data:
