<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{fragments/layout :: head('ログイン (Vulnerable)')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('vulnerable')}"></header>

<main class="container">
    <h1>ログイン <small style="color:#b91c1c">[Vulnerable]</small></h1>
    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>

    <form th:action="@{/vulnerable/login}" th:object="${loginForm}" method="post" class="card">
        <label>ユーザー名</label>
        <input type="text" th:field="*{username}" autocomplete="username">

        <label>パスワード</label>
        <input type="password" th:field="*{password}" autocomplete="current-password">

        <div style="margin-top:1rem">
            <button type="submit" class="btn btn-primary">ログイン</button>
            <a class="btn btn-secondary" th:href="@{/vulnerable/register}">新規登録</a>
        </div>
    </form>

    <div class="card">
        <h3>初期ユーザー（教材用・平文）</h3>
        <table>
            <tr><th>ユーザー名</th><th>パスワード</th></tr>
            <tr><td>admin</td><td>admin123</td></tr>
            <tr><td>alice</td><td>wonderland</td></tr>
            <tr><td>bob</td><td>builder</td></tr>
        </table>
        <p>SQL インジェクションを試したい場合は、ユーザー名に <code>' OR 1=1 -- </code>（末尾はスペース 1 つ）、パスワードは任意で送信。詳細・別パターンは <a th:href="@{/docs/sqli}">SQLi 解説</a>へ。</p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
