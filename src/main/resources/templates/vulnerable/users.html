<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{fragments/layout :: head('ユーザー一覧 (Vulnerable)')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('vulnerable')}"></header>

<main class="container">
    <h1>ユーザー一覧 <small style="color:#b91c1c">[Vulnerable]</small></h1>
    <p class="card" style="background:#fff7ed;border-color:#fdba74">
        <strong>教材メモ:</strong> ナビの「ユーザー一覧」は <strong>ADMIN ログイン時だけ</strong>表示しますが、
        サーバ側にはロールチェックがありません。<code>/vulnerable/users</code> を URL 直打ちすると、
        一般ユーザ・未ログインでもこの画面を開けます（画面だけ ADMIN 向けに見せている「セキュリティ・バイ・オブスキュリティ」）。
    </p>
    <table class="card" style="padding:0">
        <tr><th>ID</th><th>ユーザー名</th><th>メール</th><th>役割</th><th></th></tr>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}"></td>
            <td><a th:href="@{/vulnerable/users/{id}(id=${u.id})}" th:text="${u.username}"></a></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.role}"></td>
            <td>
                <small>パスワード: <code th:text="${u.password}"></code></small>
            </td>
        </tr>
    </table>
    <p>※平文パスワードがそのまま画面に出てしまっている点にも注目。</p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
